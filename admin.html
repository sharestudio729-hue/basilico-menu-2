<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لوحة تحكم Basilico</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root{
    --bg:#121212; --panel:#1b1b1b; --panel2:#222; --border:#333; --text:#f2f2f2;
    --muted:#9a9a9a; --accent:#2e7d4f; --accent2:#3fae73; --danger:#c0392b; --warn:#b8860b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;}
  header h1 span{color:var(--accent2);font-family:'Brush Script MT',cursive;font-size:22px;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;
    cursor:pointer;transition:.15s;}
  .btn:hover{background:var(--accent2);}
  .btn.secondary{background:#333;}
  .btn.secondary:hover{background:#444;}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#e0453a;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;
    width:100%;max-width:360px;text-align:center;}
  .login-box h2{margin-top:0;}
  .login-box input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:15px;margin:14px 0;}
  .login-box .err{color:#ff8a80;font-size:13px;min-height:18px;margin-top:4px;}
  main{max-width:1100px;margin:0 auto;padding:18px;display:none;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .toolbar input[type=text]{flex:1;min-width:180px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;}
  .toolbar select{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
  .stat{color:var(--muted);font-size:13px;}
  .cat-group{margin-bottom:26px;}
  .cat-title{font-size:16px;color:var(--accent2);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;}
  .item-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;
    display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;}
  .thumb-wrap{position:relative;width:72px;height:72px;flex:none;}
  .thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#2a2a2a;border:1px solid var(--border);}
  .thumb-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .thumb-wrap .thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);
    font-size:9px;text-align:center;padding:2px 0;border-radius:0 0 8px 8px;pointer-events:none;}
  .fields{flex:1;min-width:220px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .fields .full{grid-column:1/-1;}
  .fields label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
  .fields input, .fields select{width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13px;}
  .row-actions{display:flex;flex-direction:column;gap:6px;flex:none;}
  .row-actions .btn{font-size:12px;padding:7px 12px;white-space:nowrap;}
  .toggle-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .toggle{width:36px;height:20px;border-radius:12px;background:#444;position:relative;cursor:pointer;flex:none;}
  .toggle.on{background:var(--accent);}
  .toggle .dot{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on .dot{right:18px;}
  .badge-new{background:var(--warn);color:#fff;font-size:10px;padding:1px 6px;border-radius:5px;margin-right:6px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--border);
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.err{border-color:var(--danger);color:#ff8a80;}
  .toast.ok{border-color:var(--accent2);color:#9be3bb;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:420px;}
  .modal h3{margin-top:0;}
  .modal label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px;}
  .modal input, .modal select{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  @media(max-width:520px){.fields{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>🔒 لوحة تحكم <span style="font-family:'Brush Script MT',cursive;color:#3fae73;">Basilico</span></h2>
    <p style="color:#9a9a9a;font-size:13px;">أدخل كلمة السر للدخول إلى إدارة المنيو</p>
    <input type="password" id="pw-input" placeholder="كلمة السر" />
    <button class="btn" id="login-btn" style="width:100%;">دخول</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<main id="app">
  <header style="position:static;border:none;padding:0;margin-bottom:18px;">
    <h1>لوحة تحكم <span>Basilico</span> — إدارة المنيو</h1>
    <div style="display:flex;gap:8px;">
      <button class="btn" id="add-btn">+ إضافة صنف جديد</button>
      <button class="btn secondary" id="refresh-btn">تحديث</button>
      <button class="btn secondary" id="logout-btn">خروج</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="بحث عن صنف بالاسم..." />
    <select id="cat-filter"><option value="">كل التصنيفات</option></select>
    <select id="avail-filter">
      <option value="">كل الحالات</option>
      <option value="1">متاح فقط</option>
      <option value="0">غير متاح فقط</option>
    </select>
    <span class="stat" id="stat-text"></span>
  </div>

  <div id="items-container"><div class="empty">جاري التحميل...</div></div>
</main>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="add-modal-bg">
  <div class="modal">
    <h3>إضافة صنف جديد</h3>
    <label>الاسم</label>
    <input type="text" id="new-name" />
    <label>التصنيف</label>
    <input type="text" id="new-category" list="cat-list" placeholder="اكتب تصنيف موجود أو جديد" />
    <datalist id="cat-list"></datalist>
    <label>السعر (جنيه)</label>
    <input type="number" id="new-price" value="0" />
    <label>الصورة</label>
    <input type="file" id="new-photo" accept="image/*" />
    <label><input type="checkbox" id="new-available" checked style="width:auto;display:inline-block;margin-left:6px;" /> متاح للطلب</label>
    <label>الكمية المتاحة (اتركها فارغة = غير محدودة)</label>
    <input type="number" id="new-stock" placeholder="غير محدود" />
    <div class="modal-actions">
      <button class="btn secondary" id="add-cancel">إلغاء</button>
      <button class="btn" id="add-save">إضافة</button>
    </div>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

let ALL_ITEMS = [];

function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}

async function api(path, opts){
  opts = opts || {};
  opts.credentials = 'include';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch(e){}
  if(!res.ok){
    throw new Error((data && data.error) || ('خطأ: ' + res.status));
  }
  return data;
}

// ---------- Auth ----------
async function checkSession(){
  try{
    const r = await api('/api/admin/session');
    if(r.authed){ showApp(); return; }
  }catch(e){}
  showLogin();
}

function showLogin(){
  $('#login-screen').style.display = 'flex';
  $('#app').style.display = 'none';
}
function showApp(){
  $('#login-screen').style.display = 'none';
  $('#app').style.display = 'block';
  loadItems();
}

$('#login-btn').addEventListener('click', doLogin);
$('#pw-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const pw = $('#pw-input').value;
  $('#login-err').textContent = '';
  if(!pw) return;
  try{
    await api('/api/admin/login', { method:'POST', body: JSON.stringify({ password: pw }) });
    $('#pw-input').value='';
    showApp();
  }catch(e){
    $('#login-err').textContent = e.message || 'خطأ في تسجيل الدخول';
  }
}

$('#logout-btn').addEventListener('click', async ()=>{
  try{ await api('/api/admin/logout', { method:'POST' }); }catch(e){}
  showLogin();
});

// ---------- Load & render ----------
async function loadItems(){
  $('#items-container').innerHTML = '<div class="empty">جاري التحميل...</div>';
  try{
    const r = await api('/api/admin/items');
    ALL_ITEMS = r.items || [];
    populateCategoryOptions();
    render();
  }catch(e){
    $('#items-container').innerHTML = '<div class="empty">تعذر تحميل المنيو: '+ (e.message||'') +'</div>';
  }
}
$('#refresh-btn').addEventListener('click', loadItems);

function populateCategoryOptions(){
  const cats = Array.from(new Set(ALL_ITEMS.map(i=>i.category))).sort();
  const sel = $('#cat-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">كل التصنيفات</option>' + cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = cur;
  $('#cat-list').innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matchesFilters(it){
  const q = $('#search-input').value.trim().toLowerCase();
  const cat = $('#cat-filter').value;
  const avail = $('#avail-filter').value;
  if(q && !it.name.toLowerCase().includes(q)) return false;
  if(cat && it.category !== cat) return false;
  if(avail === '1' && !it.available) return false;
  if(avail === '0' && it.available) return false;
  return true;
}

['search-input'].forEach(id=>$('#'+id).addEventListener('input', render));
['cat-filter','avail-filter'].forEach(id=>$('#'+id).addEventListener('change', render));

function render(){
  const filtered = ALL_ITEMS.filter(matchesFilters);
  $('#stat-text').textContent = `${filtered.length} من ${ALL_ITEMS.length} صنف`;
  const byCat = {};
  filtered.forEach(it=>{ (byCat[it.category] = byCat[it.category]||[]).push(it); });
  const cats = Object.keys(byCat).sort();
  if(!cats.length){
    $('#items-container').innerHTML = '<div class="empty">لا توجد أصناف مطابقة</div>';
    return;
  }
  $('#items-container').innerHTML = cats.map(cat => `
    <div class="cat-group">
      <div class="cat-title">${esc(cat)} (${byCat[cat].length})</div>
      ${byCat[cat].map(renderItemCard).join('')}
    </div>
  `).join('');

  // wire up events
  cats.forEach(cat => byCat[cat].forEach(it => wireItemCard(it)));
}

function renderItemCard(it){
  const img = it.photo || '';
  return `
  <div class="item-card" data-id="${it.id}">
    <div class="thumb-wrap">
      ${img ? `<img class="thumb" src="${esc(img)}" />` : `<div class="thumb"></div>`}
      <input type="file" accept="image/*" data-role="photo-input" title="تغيير الصورة" />
      <div class="thumb-label">تغيير الصورة</div>
    </div>
    <div class="fields">
      <div class="full"><label>${it.isNew ? '<span class="badge-new">جديد</span>' : ''}الاسم</label>
        <input type="text" data-role="name" value="${esc(it.name)}" /></div>
      <div><label>التصنيف</label><input type="text" data-role="category" value="${esc(it.category)}" list="cat-list" /></div>
      <div><label>السعر</label><input type="number" data-role="price" value="${it.price}" /></div>
      <div><label>الكمية (فارغ = غير محدود)</label><input type="number" data-role="stock" value="${it.stock===null||it.stock===undefined?'':it.stock}" placeholder="غير محدود" /></div>
      <div class="toggle-wrap">
        <div class="toggle ${it.available?'on':''}" data-role="avail-toggle"><div class="dot"></div></div>
        <span data-role="avail-label">${it.available?'متاح':'غير متاح'}</span>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn" data-role="save">حفظ</button>
      <button class="btn danger" data-role="delete">حذف</button>
    </div>
  </div>`;
}

function wireItemCard(it){
  const card = document.querySelector(`.item-card[data-id="${CSS.escape(String(it.id))}"]`);
  if(!card) return;
  let available = it.available;

  const toggle = card.querySelector('[data-role="avail-toggle"]');
  toggle.addEventListener('click', ()=>{
    available = !available;
    toggle.classList.toggle('on', available);
    card.querySelector('[data-role="avail-label"]').textContent = available ? 'متاح' : 'غير متاح';
  });

  card.querySelector('[data-role="photo-input"]').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await fileToDataUrl(file);
    toast('جاري رفع الصورة...', '');
    try{
      const up = await api('/api/admin/upload', { method:'POST', body: JSON.stringify({ dataUrl, itemId: it.id }) });
      await api('/api/admin/items', { method:'PUT', body: JSON.stringify({ id: it.id, photo: up.url }) });
      toast('تم تحديث الصورة ✓', 'ok');
      await loadItems();
    }catch(err){
      toast(err.message || 'فشل رفع الصورة', 'err');
    }
  });

  card.querySelector('[data-role="save"]').addEventListener('click', async ()=>{
    const name = card.querySelector('[data-role="name"]').value.trim();
    const category = card.querySelector('[data-role="category"]').value.trim();
    const price = Number(card.querySelector('[data-role="price"]').value);
    const stockRaw = card.querySelector('[data-role="stock"]').value;
    const stock = stockRaw === '' ? null : Number(stockRaw);
    try{
      await api('/api/admin/items', { method:'PUT', body: JSON.stringify({
        id: it.id, name, category, price, stock, available
      })});
      toast('تم الحفظ ✓', 'ok');
      await loadItems();
    }catch(err){
      toast(err.message || 'فشل الحفظ', 'err');
    }
  });

  card.querySelector('[data-role="delete"]').addEventListener('click', async ()=>{
    if(!confirm(`هل تريد حذف "${it.name}" نهائياً؟`)) return;
    try{
      await api('/api/admin/items?id=' + encodeURIComponent(it.id), { method:'DELETE' });
      toast('تم الحذف ✓', 'ok');
      await loadItems();
    }catch(err){
      toast(err.message || 'فشل الحذف', 'err');
    }
  });
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ---------- Add new item modal ----------
$('#add-btn').addEventListener('click', ()=>{
  $('#new-name').value=''; $('#new-category').value=''; $('#new-price').value='0';
  $('#new-photo').value=''; $('#new-available').checked=true; $('#new-stock').value='';
  $('#add-modal-bg').classList.add('show');
});
$('#add-cancel').addEventListener('click', ()=> $('#add-modal-bg').classList.remove('show'));

$('#add-save').addEventListener('click', async ()=>{
  const name = $('#new-name').value.trim();
  const category = $('#new-category').value.trim();
  const price = Number($('#new-price').value) || 0;
  const available = $('#new-available').checked;
  const stockRaw = $('#new-stock').value;
  const stock = stockRaw === '' ? null : Number(stockRaw);
  if(!name || !category){ toast('الاسم والتصنيف مطلوبان', 'err'); return; }

  let photoUrl = null;
  const file = $('#new-photo').files[0];
  try{
    if(file){
      const dataUrl = await fileToDataUrl(file);
      toast('جاري رفع الصورة...', '');
      const up = await api('/api/admin/upload', { method:'POST', body: JSON.stringify({ dataUrl, itemId: 'new' }) });
      photoUrl = up.url;
    }
    await api('/api/admin/items', { method:'POST', body: JSON.stringify({
      name, category, price, available, stock, photo: photoUrl
    })});
    toast('تمت الإضافة ✓', 'ok');
    $('#add-modal-bg').classList.remove('show');
    await loadItems();
  }catch(err){
    toast(err.message || 'فشلت الإضافة', 'err');
  }
});

checkSession();
</script>
</body>
</html>
